name: Build & Release Solo Leveling APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solo-leveling-system-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (Push to main only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "Solo Leveling System v1.0.${{ github.run_number }}"
          body: |
            ### ⚔️ Solo Leveling: System - Daily Workout & Hunter Awakening
            
            **Autonomous Android System Initialization Complete.**
            
            #### Features Included:
            - **Anime HUD Aesthetic:** Obsidian background, neon violet/magenta glowing borders, notched HUD cards.
            - **Hunter Awakening Evaluation:** Initial onboarding questionnaire assessing physical capacity, computing initial STR/AGI/VIT/INT/PER stats and assigning Hunter Rank (E-Rank to S-Rank).
            - **Dynamic Daily Quests:** Push-ups, sit-ups, squats, and running targets that scale as hunter levels up.
            - **Hardware Step Counter:** Integrates Android `TYPE_STEP_COUNTER` to auto-fill the running bar.
            - **System Notifications & Alarms:** Daily quest reminders and Penalty Quest heads-up alerts.
            - **Gate Clearance Raids:** Sub-quest dungeon raids with boss fights, EXP, and legendary loot.
            - **Hunter Character Progression:** Attribute point allocation, Inventory system, and Skill trees.
            - **Local Persistence:** Room DB tracking player stats and workout state.
            
            📥 **Download:** Download `app-debug.apk` below and install directly onto your Android device!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
